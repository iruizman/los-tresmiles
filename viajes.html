<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Archivo de viajes de Los Tresmiles de Iñaki.">
  <title>Viajes · Los Tresmiles de Iñaki</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/cumbres.css">
  <link rel="stylesheet" href="./css/viajes.css">
</head>
<body class="inner-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Ir al inicio">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 64 42">
          <path d="M3 37 20 9l10 16 8-12 23 24H3Z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="m15 25 5-7 5 8m9-5 4-5 6 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Los Tresmiles de Iñaki</span>
    </a>
    <nav aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#estadisticas">Progreso</a>
      <a href="index.html#mapa">Mapa</a>
      <a class="active" aria-current="page" href="viajes.html">Viajes</a>
      <a href="cumbres.html">Cumbres</a>
      <a href="personas.html">Personas</a>
    </nav>
  </header>

  <main>
    <section class="archive-hero trip-archive-hero">
      <div class="shell">
        <nav class="breadcrumbs" aria-label="Migas de pan">
          <a href="index.html">Inicio</a><span>/</span><span>Viajes</span>
        </nav>
        <p class="eyebrow">Memoria de montaña</p>
        <h1>Los viajes</h1>
        <p id="trip-summary" class="archive-summary">Cargando los viajes…</p>
      </div>
    </section>

    <section class="archive-section shell">
      <div class="trip-toolbar">
        <label class="archive-search">
          <span>Buscar un viaje</span>
          <input id="trip-search" type="search" placeholder="Aneto, Viadós, Francia…" autocomplete="off">
        </label>

        <label>
          <span>Año</span>
          <select id="trip-year"><option value="">Todos</option></select>
        </label>

        <label>
          <span>Zona</span>
          <select id="trip-zone"><option value="">Todas</option></select>
        </label>

        <label>
          <span>Orden</span>
          <select id="trip-order">
            <option value="date-desc">Más recientes</option>
            <option value="date-asc">Más antiguos</option>
            <option value="summits-desc">Más cumbres</option>
            <option value="name">Nombre</option>
          </select>
        </label>

        <button id="trip-reset" class="reset-button" type="button">Limpiar</button>
      </div>

      <div class="archive-results-line">
        <p id="trip-count"></p>
      </div>

      <div id="trip-grid" class="trip-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer shell">
    <p>Viajes conectados con cumbres, personas, fotos y tracks.</p>
    <a href="index.html">Volver al inicio ↑</a>
  </footer>

  <script type="module" src="./js/viajes.js"></script>
  <script src="./js/site-nav.js"></script>
</body>
</html>
